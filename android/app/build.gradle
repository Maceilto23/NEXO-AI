plugins { id 'com.android.application' }

android {
    namespace 'com.nexoai.ultra'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexoai.ultra'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
